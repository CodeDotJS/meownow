name = "meownow-edge"
main = "src/index.ts"
compatibility_date = "2026-08-21"

[vars]
# Local wrangler dev. Production deploy overrides via `pnpm deploy` (--var APP_URL).
APP_URL = "http://localhost:3000"
# HUB_SECRET and CAPABILITY_TOKEN_PUBLIC_KEY: local `.dev.vars`, production `wrangler secret put`.

[durable_objects]
bindings = [{ name = "HUB", class_name = "HubDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubDO"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "meownow-blobs"
# Do not set a bucket-wide object expiry. Pinned items must outlive the 7-day default TTL.
# Abort incomplete multipart uploads in the dashboard if you enable MPU later.

[triggers]
crons = ["0 3 * * *"]
