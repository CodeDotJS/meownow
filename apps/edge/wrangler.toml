name = "meownow-edge"
main = "src/index.ts"
compatibility_date = "2026-08-21"

[vars]
APP_URL = "http://localhost:3000"
# Local default. Production: `wrangler secret put HUB_SECRET`.
HUB_SECRET = "dev-hub-secret-must-be-32-char!!"
# Local default. Production: `wrangler secret put CAPABILITY_TOKEN_PUBLIC_KEY`.
CAPABILITY_TOKEN_PUBLIC_KEY = "{\"kty\":\"OKP\",\"crv\":\"Ed25519\",\"x\":\"hhT-BvZi_645PEVLTTtWJvQ-OFOU5XEo2_GbnRRd6WY\"}"

[durable_objects]
bindings = [{ name = "HUB", class_name = "HubDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubDO"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "meownow-blobs"
# Do not set a bucket-wide object expiry. Pinned items must outlive the 7-day default TTL.
# Abort incomplete multipart uploads in the dashboard if you enable MPU later.

[triggers]
crons = ["0 3 * * *"]
